services:
  - type: web
    name: study-saathi-pdf-processor
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PDF_PROCESSOR_API_KEY
        sync: false
